name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.26.x
          - 1.27.x
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Verify
        run: make verify

      - name: Verify clean module consumption
        run: make consumer-smoke

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: aep-go-coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out AEP specifications
        uses: actions/checkout@v7
        with:
          repository: aep-foundation/aep-specs
          path: .conformance/aep-specs

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: .conformance/aep-specs/ietf

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - name: Run shared conformance harness
        run: make conformance
        env:
          AEP_SPECS_DIR: .conformance/aep-specs

      - name: Upload conformance reports
        uses: actions/upload-artifact@v7
        with:
          name: aep-go-conformance
          path: .conformance/reports/*.json
          if-no-files-found: error
          retention-days: 7
