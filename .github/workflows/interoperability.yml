name: Node.js interoperability

on:
  pull_request:
    paths:
      - ".github/workflows/interoperability.yml"
      - "Makefile"
      - "agent/**"
      - "cmd/aep-interop/**"
      - "go.mod"
      - "go.sum"
      - "platform/**"
      - "scripts/run-node-interoperability.sh"
      - "scripts/verify-node-interoperability.mjs"
      - "service/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: aep-go

      - uses: actions/checkout@v7
        with:
          repository: aep-foundation/aep-node
          path: aep-node

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: corepack enable

      - name: Install Node.js dependencies
        working-directory: aep-node
        run: pnpm install --frozen-lockfile

      - name: Run bidirectional interoperability
        working-directory: aep-go
        run: make interoperability
        env:
          AEP_INTEROP_OUTPUT_DIR: .interop/reports
          AEP_NODE_DIR: ../aep-node

      - name: Upload interoperability report
        uses: actions/upload-artifact@v7
        with:
          name: aep-go-node-interoperability
          path: aep-go/.interop/reports/aep-go-node-interoperability.json
          if-no-files-found: error
          retention-days: 7
